name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Edge Functions (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Supabase functions use pinned npm: and jsr: imports directly.
      - run: deno lint --rules-exclude=no-import-prefix supabase/functions
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - run: deno test --node-modules-dir=none --no-check=remote --allow-read --allow-env supabase/functions/tests/*.test.ts

  migrations:
    name: Migrations (throwaway Postgres + behaviour checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-migrations.sh

  trading-core:
    name: TradingCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: TradingCore

  web:
    name: Web app (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test src/lib/portfolio-movement.test.ts src/lib/csv.test.ts src/server/portfolio/lots.test.ts src/server/agent/agent-safety.test.ts src/server/research/financials.test.ts
      - run: npm run build

  ios:
    name: iOS app (Release build + UI test bundle)
    # The app targets iOS 26.1, which needs an Xcode 26+ toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Secrets stub (reads Config/Secrets.plist, absent in CI, so every key is empty)
        run: cp "Stock Tracker/SecretsConfig.swift.template" "Stock Tracker/SecretsConfig.swift"
      - name: Release build
        run: >
          xcodebuild -project "Stock Tracker.xcodeproj" -scheme "Stock Tracker"
          -configuration Release -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Debug build for testing (app + UI tests)
        run: >
          xcodebuild -project "Stock Tracker.xcodeproj" -scheme "Stock Tracker"
          -configuration Debug -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build-for-testing
